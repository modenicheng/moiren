name: Runtime foundation
on:
  push:
    branches: [engine/flat-buffer-control-foundation]
  pull_request:
    paths:
      - 'crates/moiren-core/**'
      - 'crates/moiren-engine/**'
      - '.github/workflows/runtime-foundation.yml'
      - 'Cargo.*'
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --profile minimal
      - run: rustup component add rustfmt clippy --toolchain stable
      - run: cargo +stable test --locked -p moiren-core -p moiren-engine
      - if: always()
        run: cargo +stable clippy --locked -p moiren-core -p moiren-engine --all-targets -- -D warnings
      - name: Check formatting
        id: fmt
        if: always()
        continue-on-error: true
        run: cargo +stable fmt -p moiren-core -p moiren-engine -- --check
      - name: Prepare formatting patch
        if: steps.fmt.outcome == 'failure'
        run: |
          cargo +stable fmt -p moiren-core -p moiren-engine
          git diff --binary > "$RUNNER_TEMP/runtime-format.patch"
      - uses: actions/upload-artifact@v4
        if: steps.fmt.outcome == 'failure'
        with:
          name: runtime-format-${{ matrix.os }}
          path: ${{ runner.temp }}/runtime-format.patch
      - name: Require formatting
        if: steps.fmt.outcome == 'failure'
        run: exit 1
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test --locked -p moiren-core -p moiren-engine
      - run: cargo +nightly miri test --locked -p moiren-core -p moiren-engine
        env:
          MIRIFLAGS: '-Zmiri-tree-borrows'
