name: Runtime foundation
on:
  push:
    branches: [main, engine/flat-buffer-control-foundation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libfontconfig1-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libxdo-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable check --locked --workspace --all-targets
      - run: cargo +stable test --locked --workspace
      - name: Test headless desktop UI
        if: runner.os == 'Windows'
        run: cargo +stable test --locked -p moiren-app --features gpui-test
      - if: always()
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - if: always()
        run: cargo +stable fmt --all -- --check
      - run: cargo +stable run --locked -p moiren-engine --example offline
      - run: cargo +stable run --locked -p moiren-engine --example logical_graph
      - run: cargo +stable run --locked -p moiren-engine --example managed_graph
      - run: cargo +stable run --locked -p moiren-app -- --gain 0.25
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      # Miri covers the portable RT contracts; native GPUI/GTK is tested above.
      - run: cargo +nightly miri test --locked -p moiren-core -p moiren-engine -p moiren-signal
      - run: cargo +nightly miri test --locked -p moiren-core -p moiren-engine -p moiren-signal
        env:
          MIRIFLAGS: '-Zmiri-tree-borrows'
