[package]
name = "moiren-professional-rt-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone harness workspace: it is intentionally NOT a member of the root
# workspace (the root lists its members explicitly) so its target directory
# stays out of the library source tree.
[workspace]

[dependencies]
log = "0.4"
moiren-core = { path = "../../crates/moiren-core" }
moiren-engine = { path = "../../crates/moiren-engine" }
moiren-windows-audio = { path = "../../crates/moiren-windows-audio" }
rtrb = "=0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

# The single test target is auto-discovered from tests/professional_rt.rs; it
# shadow-compiles the library's professional modules through #[path] includes.
