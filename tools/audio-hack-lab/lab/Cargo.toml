[workspace]

[package]
name = "audio-hack-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
debug = true
