[package]
name = "moiren-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
moiren-core = { path = "../moiren-core" }
moiren-engine = { path = "../moiren-engine" }
slint = "1.18.1"
thiserror = { workspace = true }

[build-dependencies]
slint-build = "1.18.1"

[target."cfg(windows)".dependencies]
moiren-windows-audio = { path = "../moiren-windows-audio" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# window_shadows = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
