[package]
name = "moiren-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
flexi_logger = { workspace = true }
log = { workspace = true }
gpui-kit = "0.7.3"
moiren-core = { path = "../moiren-core" }
moiren-engine = { path = "../moiren-engine" }
moiren-signal = { path = "../moiren-signal" }
raw-window-handle = "0.6"
# Compile-time embedded translations; locale switch is process-global and
# shared with gpui-component's own translation backend.
rust-i18n = "4.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tray-icon = "0.21"

[build-dependencies]
resvg = { version = "0.46", default-features = false }
embed-resource = "3.0"

[features]
# UI headless tests activate gpui-kit test-support without affecting release builds.
gpui-test = ["gpui-kit/test-support"]
# Native capture diagnostics; never enabled in ordinary application builds.
ui-profiler = ["gpui-test", "gpui-kit/profiler"]
# Explicit target service/VAD integration probe; ordinary builds never run it.
vad-integration-probe = []

[[example]]
name = "ui_capture"
required-features = ["gpui-test"]

[[example]]
name = "vad_integration"
required-features = ["vad-integration-probe"]

[dev-dependencies]
# Backend tests exercise the portable renderer without enabling native audio.
moiren-windows-audio = { path = "../moiren-windows-audio" }

[target."cfg(windows)".dependencies]
windows-registry = "0.6"
moiren-windows-audio = { path = "../moiren-windows-audio" }
# window_shadows = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }
