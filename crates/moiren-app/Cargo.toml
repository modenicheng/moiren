[package]
name = "moiren-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
moiren-core = { path = "../moiren-core" }
moiren-engine = { path = "../moiren-engine" }
moiren-signal = { path = "../moiren-signal" }
serde_json = "1.0"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "unstable-winit-030",
    "renderer-skia",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }
thiserror = { workspace = true }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
# Backend tests exercise the portable renderer without enabling native audio.
moiren-windows-audio = { path = "../moiren-windows-audio" }

[target."cfg(windows)".dependencies]
moiren-windows-audio = { path = "../moiren-windows-audio" }
serde = { version = "1.0", features = ["derive"] }
# window_shadows = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }
