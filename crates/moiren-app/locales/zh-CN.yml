  en: Configure never changes routing. Use next start on a device row updates the candidate graph.
  zh-CN: 配置不会改变路由。设备行中的下次启动时使用会更新候选图。
"Export is no longer in this project's candidate graph":
  en: Export is no longer in this project's candidate graph
  zh-CN: 该导出已不在此项目的候选图中
"Virtual exports":
  en: Virtual exports
  zh-CN: 虚拟导出
"Edit project intent here, then Apply graph to request activation. Endpoint presence is not evidence of audio flowing. Stop keeps endpoints present with gates closed.":
  en: Edit project intent here, then Apply graph to request activation. Endpoint presence is not evidence of audio flowing. Stop keeps endpoints present with gates closed.
  zh-CN: 在此编辑项目意图，然后应用图以请求激活。端点存在并不代表音频正在流动。停止后端点仍保留，但闸门关闭。
"Bind a selected Graph IO with matching channels: Playback uses a Source; Microphone uses a Sink. An IO can belong to only one export.":
  en: "Bind a selected Graph IO with matching channels: Playback uses a Source; Microphone uses a Sink. An IO can belong to only one export."
  zh-CN: 将选中的通道数匹配的图 IO 绑定：播放使用源节点；麦克风使用输出节点。一个 IO 只能属于一个导出。
"Default eligibility is permission on this computer only, not saved in the project. Off prevents both Windows automatic and user manual default selection. On only permits eligibility; it does not set a Windows default.":
  en: Default eligibility is permission on this computer only, not saved in the project. Off prevents both Windows automatic and user manual default selection. On only permits eligibility; it does not set a Windows default.
  zh-CN: 默认资格仅是本机上的许可，不会保存到项目中。关闭时既阻止 Windows 自动选择默认，也阻止用户手动设为默认。开启只表示允许成为默认，并不会设置 Windows 默认设备。
"Changing channels, a name, or eligibility safely retires and recreates the endpoint. Apply again to resume; unbind incompatible Graph IO before changing channels.":
  en: Changing channels, a name, or eligibility safely retires and recreates the endpoint. Apply again to resume; unbind incompatible Graph IO before changing channels.
  zh-CN: 更改声道数、名称或默认资格会安全退役并重建端点。再次应用即可恢复；更改声道数前请先解绑不兼容的图 IO。
"No virtual exports yet. Create one above; it starts unbound.":
  en: No virtual exports yet. Create one above; it starts unbound.
  zh-CN: 还没有虚拟导出。在上方创建一个；初始为未绑定状态。
