"ASIO uses one driver session for input and output. Rate and buffer requests must agree across that session; encoding is determined by the driver. Select a driver in Devices.":
  en: ASIO uses one driver session for input and output. Rate and buffer requests must agree across that session; encoding is determined by the driver. Select a driver in Devices.
  zh-CN: ASIO 的输入与输出共用一个驱动会话。采样率与缓冲请求在整个会话中必须一致；编码由驱动决定。请在设备页中选择驱动。
