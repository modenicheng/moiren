  zh-CN: "%{input_count} 个输入 / %{output_count} 个输出覆盖配置。可在设备页中配置单个设备；默认设置变化时，覆盖配置会完整保留自身设置。"
"Explicit audio settings use the requested device buffers. Legacy queue/recovery profiles apply to the default WASAPI shared configuration.":
  en: Explicit audio settings use the requested device buffers. Legacy queue/recovery profiles apply to the default WASAPI shared configuration.
  zh-CN: 显式音频设置使用所请求的设备缓冲。旧式队列/恢复策略仅适用于默认的 WASAPI 共享配置。
