[package]
name = "moiren-windows-audio"
version = "0.1.0"
edition = "2024"
description = "Engine-backed WASAPI Shared capture/render, clock adaptation and opt-in probes"

[lints]
workspace = true

[dependencies]
moiren-core = { path = "../moiren-core" }
moiren-engine = { path = "../moiren-engine" }
rtrb = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
flexi_logger = { workspace = true }
moiren-signal = { path = "../moiren-signal" }

[features]
# Opt-in probe tooling (`probe`, `exclusive_probe`, `physical`, `swdevice`).
# Only the W00/exclusive probe examples consume these modules; the feature
# keeps their COM surface out of default library builds for engine/app
# consumers. Build the probe examples with:
#   cargo build -p moiren-windows-audio --examples --features probe-tools
probe-tools = []

# Explicit VAD lifecycle/native probes; no driver/device exercise during tests.
vad-probe = []

# `cargo build --examples` skips examples whose required features are off, so
# the probe examples declare the feature instead of failing the default build.
[[example]]
name = "w00_probe"
required-features = ["probe-tools"]

[[example]]
name = "w00_physical"
required-features = ["probe-tools"]

[[example]]
name = "w00_swdevice"
required-features = ["probe-tools"]

[[example]]
name = "exclusive_probe"
required-features = ["probe-tools"]

[[example]]
name = "vad_lifecycle"
required-features = ["vad-probe"]

[[example]]
name = "vad_native"
required-features = ["vad-probe"]

[[example]]
name = "vad_active_lifecycle"
required-features = ["vad-probe"]

[target.'cfg(windows)'.dependencies]
# windows-core is not referenced by handwritten code: the #[implement]
# macro's expansion references `::windows_core` directly.
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Enumeration_Pnp",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
