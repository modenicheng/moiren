[workspace]
resolver = "3"
members = [
    "crates/moiren-core",
    "crates/moiren-engine",
    "crates/moiren-app",
    "crates/moiren-windows-audio",
    "crates/moiren-signal",
]

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
flexi_logger = "0.31.10"
log = "0.4"
rtrb = "=0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Exact pin: this crate family's public API exposes `windows::core` types,
# so a second version in the graph fails compilation instead of degrading.
# windows-core is also declared by the crates whose `#[implement]` macro
# expansions reference `::windows_core` directly.
windows = "=0.62.2"
windows-core = "=0.62.2"

[workspace.lints.rust]
# Deny locally what CI denies with `-D warnings`, so lint drift cannot pass
# a local run and only fail in CI. Additive over the default lint set.
future_incompatible = "deny"
unused = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Frame-pacing patches on top of the published gpui-pre-windows 0.3.9:
# skip invalidating iconic windows, pace each window on its output's vblank,
# and follow refresh-rate changes. One commit per patch on pristine 0.3.9 so
# each can be upstreamed (mechanism tracked as zed#66221); see
# docs/platform/gpui-fork.md for the rebase procedure.
[patch.crates-io]
gpui-pre-windows = { git = "https://github.com/modenicheng/gpui-pre-windows" }
